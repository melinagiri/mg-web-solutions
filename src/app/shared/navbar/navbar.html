<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="nav-inner">
    <!-- Logo -->
    <a routerLink="/" class="nav-logo" (click)="closeMenu()">
      <div class="logo-mark">MG</div>
      <div class="logo-text">
        <span class="logo-name">MG Web Solutions</span>
        <span class="logo-sub">WEB SOLUTIONS</span>
      </div>
    </a>

    <!-- Desktop Links -->
    <ul class="nav-links">
      @for (link of navLinks; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="active" class="nav-link">{{ link.label }}</a>
      </li>
      }
    </ul>

    <!-- Desktop CTA -->
    <a routerLink="/contact" class="btn-nav-cta" (click)="closeMenu()">Start a Project →</a>

    <!-- Hamburger -->
    <button
      class="hamburger"
      [class.open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    <ul class="mobile-links">
      @for (link of navLinks; track link.path) {
      <li>
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          class="mobile-link"
          (click)="closeMenu()"
          >{{ link.label }}</a
        >
      </li>
      }
    </ul>
    <a routerLink="/contact" class="btn-mobile-cta" (click)="closeMenu()">Start a Project →</a>
  </div>
</nav>
