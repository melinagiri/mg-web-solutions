<section id="pricing" class="pricing-section">
  <div class="container">

    <div class="section-header fade-in">
      <span class="section-tag">Investment</span>
      <h2>Transparent Pricing.<br>No Surprises.</h2>
      <div class="divider"></div>
    </div>

    <div class="pricing-grid fade-in">
      <div
        class="pricing-card"
        *ngFor="let plan of plans"
        [class.featured]="plan.featured"
      >
        <div class="popular-badge" *ngIf="plan.featured">MOST POPULAR</div>
        <div class="pricing-tier">{{ plan.tier }}</div>
        <div class="pricing-amount">
          {{ plan.amount }}<span>{{ plan.amountAccent }}</span>
        </div>
        <div class="pricing-best">{{ plan.bestFor }}</div>

        <ul class="pricing-features">
          <li *ngFor="let feature of plan.features">
            <span class="check">✓</span> {{ feature }}
          </li>
        </ul>

        <a
          [href]="plan.ctaLink"
          target="_blank"
          class="pricing-cta"
          [class.outline]="plan.ctaStyle === 'outline'"
          [class.solid]="plan.ctaStyle === 'solid'"
        >{{ plan.ctaLabel }}</a>
      </div>
    </div>

  </div>
</section>
