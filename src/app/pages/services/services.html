<section id="services" class="services-section">
  <div class="container">

    <div class="services-intro fade-in">
      <div>
        <span class="section-tag">What We Build</span>
        <h2>Services Designed<br>to Deliver Growth</h2>
        <div class="divider"></div>
      </div>
      <p class="section-desc">
        Every engagement starts with understanding your business — then we build the right solution.
      </p>
    </div>

    <div class="services-grid">
      <div
        class="service-card fade-in"
        *ngFor="let service of services"
      >
        <div class="service-icon">{{ service.icon }}</div>
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
        <ul class="service-features">
          <li *ngFor="let feature of service.features">{{ feature }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
