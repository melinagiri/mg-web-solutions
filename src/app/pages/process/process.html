<section id="process" class="process-section">
  <div class="container">

    <div class="section-header fade-in">
      <span class="section-tag">How We Work</span>
      <h2>Clear Process.<br>Better Results.</h2>
      <div class="divider"></div>
      <p class="section-desc">
        Every project follows a structured 5-step process to ensure clarity, quality, and on-time delivery.
      </p>
    </div>

    <div class="process-steps fade-in">
      <div class="process-step" *ngFor="let step of steps; let i = index">
        <div class="step-num">{{ step.num }}</div>
        <span class="step-icon">{{ step.icon }}</span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </div>
    </div>

  </div>
</section>
