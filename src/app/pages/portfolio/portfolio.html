<section id="projects" class="portfolio-section">
  <div class="container">

    <div class="section-header fade-in">
      <span class="section-tag">Recent Work</span>
      <h2>Projects We've Built</h2>
      <div class="divider"></div>
      <p class="section-desc">Real projects delivered — from enterprise systems to digital products.</p>
    </div>

    <div class="projects-grid">
      <div
        class="project-card fade-in"
        *ngFor="let project of projects"
      >
        <div class="project-top">
          <span class="project-icon">{{ project.icon }}</span>
          <span class="project-tag">{{ project.tag }}</span>
        </div>
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <div class="project-stack">
          <span class="stack-tag" *ngFor="let tech of project.stack">{{ tech }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
