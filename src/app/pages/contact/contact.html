<section id="contact" aria-label="Contact">
  <div class="contact-three">

    <!-- COL 1: intro -->
    <div class="contact-intro">
      <div class="section-label">
        <span class="label-text">Let's Work Together</span>
      </div>
      <h2>Have a Project in Mind?</h2>
      <p class="contact-desc">Tell me about your idea and I'll help you bring it to life.</p>
    </div>

    <!-- COL 2: form -->
    <form class="contact-form" (submit)="handleSubmit($event)" novalidate>
      <div class="form-row">
        <input type="text" placeholder="Your Name" aria-label="Your Name"
               required autocomplete="name" [(ngModel)]="name" name="name" />
        <input type="email" placeholder="Email Address" aria-label="Email Address"
               required autocomplete="email" [(ngModel)]="email" name="email" />
      </div>

      <div class="form-row">
        <select [(ngModel)]="projectType" name="projectType" aria-label="Project Type">
          <option value="">Project Type</option>
          <option>Business Website</option>
          <option>Web Application</option>
          <option>Enterprise System (ERP/CRM)</option>
          <option>UI/UX Design</option>
          <option>Not sure — let's discuss</option>
        </select>
        <select [(ngModel)]="budget" name="budget" aria-label="Budget Range">
          <option value="">Budget Range</option>
          <option>NPR 15k – 25k</option>
          <option>NPR 25k – 50k</option>
          <option>NPR 50k – 100k</option>
          <option>NPR 100k+</option>
        </select>
      </div>

      <div class="form-textarea-wrap">
        <textarea placeholder="Tell me about your project..."
                  [(ngModel)]="message" name="message"></textarea>
        <button type="submit" class="btn-red-fill contact-submit" [disabled]="isSubmitting">
          {{ submitLabel }}
        </button>
      </div>
    </form>

    <!-- COL 3: get in touch -->
    <div class="contact-touch">
      <div class="touch-label">Get In Touch</div>

      <div class="touch-item">
        <span class="touch-ic"><i data-lucide="map-pin"></i></span>
        <span>Kathmandu, Nepal</span>
      </div>

      <a href="mailto:hello@melinagiri.com.np" class="touch-item">
        <span class="touch-ic"><i data-lucide="mail"></i></span>
        <span>hello&#64;melinagiri.com.np</span>
      </a>

      <a href="tel:+9779864836945" class="touch-item">
        <span class="touch-ic"><i data-lucide="phone"></i></span>
        <span>+977-9864836945</span>
      </a>

      <a href="https://www.linkedin.com/in/melinagiri/" target="_blank" rel="noopener" class="touch-item">
        <span class="touch-ic"><i class="fa-brands fa-linkedin-in"></i></span>
        <span>linkedin.com/in/melinagiri</span>
      </a>

      <a href="https://wa.me/9779864836945" target="_blank" rel="noopener" class="touch-item touch-whatsapp">
        <span class="touch-ic">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.488-1.609zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
        </span>
        <span>Chat on WhatsApp</span>
      </a>
    </div>

  </div>

  <!-- Themed popup (replaces native alert/confirm) -->
  <app-confirm-dialog
    [open]="dialog.open"
    [type]="dialog.type"
    [title]="dialog.title"
    [message]="dialog.message"
    [confirmText]="dialog.confirmText"
    [cancelText]="dialog.cancelText"
    (confirm)="onDialogConfirm()"
    (cancel)="onDialogCancel()">
  </app-confirm-dialog>
</section>
