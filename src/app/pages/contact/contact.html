<!-- ════════════ CONTACT PAGE ════════════ -->
<div class="contact-section">
  <div class="contact-grid">
    <div class="contact-info">
      <div class="section-label">Get In Touch</div>
      <h1 class="section-title">Let's Start Your Project</h1>
      <p class="section-sub">Have an idea? Let's discuss how we can bring it to life.</p>
      <div class="contact-items">
        <div class="contact-item">
          <div class="contact-item-icon">✉️</div>
          <div>
            <div class="contact-item-label">Email</div>
            <div class="contact-item-val">contact@melinagiri.com.np</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon">📍</div>
          <div>
            <div class="contact-item-label">Location</div>
            <div class="contact-item-val">Lalitpur, Nepal</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon">💼</div>
          <div>
            <div class="contact-item-label">LinkedIn</div>
            <div class="contact-item-val">linkedin.com/in/melinagiri</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon">📘</div>
          <div>
            <div class="contact-item-label">Facebook</div>
            <div class="contact-item-val">MG Web Hub</div>
          </div>
        </div>
      </div>
    </div>

    <div class="contact-form-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-input" placeholder="Malina Giri" />
        </div>
        <div class="form-group">
          <label class="form-label">Your Email</label>
          <input type="email" class="form-input" placeholder="hello@example.com" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Project Type</label>
          <select class="form-select">
            <option>Website</option>
            <option>Web Application</option>
            <option>UI/UX Design</option>
            <option>Digital Solution</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Budget Range</label>
          <select class="form-select">
            <option>NPR 15k – 25k</option>
            <option>NPR 25k – 50k</option>
            <option>NPR 50k+</option>
            <option>Let's discuss</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Your Message</label>
        <textarea
          class="form-textarea"
          placeholder="Tell me about your project, goals, and timeline..."
        ></textarea>
      </div>
      <button class="form-submit" onclick="handleSubmit(this)">Send Message →</button>
    </div>
  </div>
</div>
